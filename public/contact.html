<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="meta.title">Contact Us | Fabric Payment Standards Foundation</title>
    <link rel="icon" href="img/logo-512x512.png">
    <meta name="description"
        content="Get in touch with the Fabric Payment Standards Foundation for membership, volunteering, or general inquiries.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <a href="#main-content" class="skip-link" data-i18n="nav.skip-to-content">Skip to content</a>

    <!-- @@include('./footer.html') -->
    <div data-include="./components/header.html"></div>

    <main id="main-content">
        <!-- Contact Hero -->
        <section class="section bg-navy text-white">
            <div class="container">
                <h1 data-i18n="contact.hero.title">Get in Touch</h1>
                <p class="hero-subtitle" data-i18n="contact.hero.subtitle">Whether you're a bank, a developer, or a
                    community member, we want to hear from you.</p>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="section">
            <div class="container narrow">
                <div class="contact-form reveal">
                    <form id="contact-form">
                        <div class="form-group">
                            <label for="name" data-i18n="contact.form.name.label">Full Name</label>
                            <input type="text" id="name" name="name" class="form-control" required
                                data-i18n="contact.form.name.placeholder">
                        </div>
                        <div class="form-group">
                            <label for="email" data-i18n="contact.form.email.label">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control" required
                                data-i18n="contact.form.email.placeholder">
                        </div>
                        <div class="form-group">
                            <label for="subject" data-i18n="contact.form.subject.label">Subject</label>
                            <select id="subject" name="subject" class="form-control">
                                <option value="general" data-i18n="contact.form.subject.options.general">General Inquiry
                                </option>
                                <option value="membership" data-i18n="contact.form.subject.options.membership">
                                    Foundation Membership</option>
                                <option value="volunteer" data-i18n="contact.form.subject.options.volunteer">
                                    Volunteering</option>
                                <option value="technical" data-i18n="contact.form.subject.options.technical">Technical
                                    Support</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message" data-i18n="contact.form.message.label">Message</label>
                            <textarea id="message" name="message" class="form-control" required
                                data-i18n="contact.form.message.placeholder"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;"
                            data-i18n="contact.form.submit">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- @@include('./footer.html') -->
    <div data-include="./components/footer.html"></div>

    <!-- Scripts -->
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>

</html>
